name: Build Publish and Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: aws-docker-html
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:

  build:
    name: Build and Publish Artifact
    runs-on: [self-hosted, Linux, X64]

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display build information
        run: |
          echo "Application: $APP_NAME"
          echo "Version: $APP_VERSION"
          echo "Commit: $GITHUB_SHA"
          echo "Runner: $RUNNER_NAME"
          echo "Host: $(hostname)"

      - name: Build Docker image
        run: |
          docker build \
            -t $APP_NAME:$APP_VERSION \
            .

      - name: Verify Docker image
        run: |
          docker images $APP_NAME

      - name: Package Docker image
        run: |
          docker save \
            $APP_NAME:$APP_VERSION \
            -o $APP_NAME-$APP_VERSION.tar

      - name: Verify artifact
        run: |
          ls -lh $APP_NAME-$APP_VERSION.tar

      - name: Publish artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}
          path: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}.tar
          retention-days: 30

      - name: Remove local tar file
        run: |
          rm -f $APP_NAME-$APP_VERSION.tar


  deploy:
    name: Deploy Artifact to EC2
    needs: build

    runs-on: [self-hosted, Linux, X64]

    steps:

      - name: Download published artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}

      - name: Verify downloaded artifact
        run: |
          echo "Deploying version: $APP_VERSION"
          ls -lh $APP_NAME-$APP_VERSION.tar

      - name: Load Docker image
        run: |
          docker load \
            -i $APP_NAME-$APP_VERSION.tar

      - name: Remove existing application container
        run: |
          docker rm -f $APP_NAME || true

      - name: Deploy version
        run: |
          docker run -d \
            --name $APP_NAME \
            --restart unless-stopped \
            -p 80:80 \
            $APP_NAME:$APP_VERSION

      - name: Verify deployment
        run: |
          sleep 3
          docker ps
          curl --fail http://localhost

      - name: Display deployed version
        run: |
          echo "Successfully deployed:"
          echo "$APP_NAME:$APP_VERSION"

      - name: Cleanup downloaded artifact
        if: always()
        run: |
          rm -f $APP_NAME-$APP_VERSION.tar
