name: Build Publish ECR and Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: aws-docker-html
  APP_VERSION: 1.0.${{ github.run_number }}

  AWS_REGION: ap-south-1
  ECR_REPOSITORY: aws-docker-html


jobs:

  # ==========================================================
  # JOB 1
  # BUILD DOCKER IMAGE
  # CREATE VERSIONED TAR
  # PUBLISH TO GITHUB ACTIONS ARTIFACTS
  # ==========================================================

  build:
    name: Build and Publish GitHub Artifact

    runs-on: [self-hosted, Linux, X64]

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Display build information
        run: |
          echo "======================================"
          echo "Application: $APP_NAME"
          echo "Version: $APP_VERSION"
          echo "Commit: $GITHUB_SHA"
          echo "Runner: $RUNNER_NAME"
          echo "Host: $(hostname)"
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "======================================"


      - name: Verify Docker
        run: |
          docker --version
          docker ps


      - name: Build Docker image
        run: |
          docker build \
            -t $APP_NAME:$APP_VERSION \
            .


      - name: Verify Docker image
        run: |
          docker images $APP_NAME


      - name: Package Docker image
        run: |
          docker save \
            $APP_NAME:$APP_VERSION \
            -o $APP_NAME-$APP_VERSION.tar


      - name: Verify generated artifact
        run: |
          pwd
          ls -lh $APP_NAME-$APP_VERSION.tar


      - name: Publish artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}
          path: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}.tar
          retention-days: 30


      # This deliberately removes the local image and tar.
      # The next job must consume the GitHub artifact.
      - name: Cleanup local build
        run: |
          rm -f $APP_NAME-$APP_VERSION.tar
          docker rmi $APP_NAME:$APP_VERSION || true



  # ==========================================================
  # JOB 2
  # DOWNLOAD GITHUB ARTIFACT
  # LOAD DOCKER IMAGE
  # PUSH EXACT IMAGE TO AMAZON ECR
  # ==========================================================

  publish-ecr:
    name: Publish Image to Amazon ECR

    needs: build

    runs-on: [self-hosted, Linux, X64]

    steps:

      - name: Download GitHub artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}


      - name: Verify downloaded artifact
        run: |
          echo "Downloaded artifact:"
          pwd
          ls -lh
          ls -lh $APP_NAME-$APP_VERSION.tar


      - name: Load Docker image from artifact
        run: |
          docker load \
            -i $APP_NAME-$APP_VERSION.tar


      - name: Verify loaded image
        run: |
          docker images $APP_NAME


      - name: Verify AWS CLI
        run: |
          aws --version


      - name: Verify EC2 IAM Role
        run: |
          aws sts get-caller-identity


      - name: Set ECR registry
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          echo "AWS_ACCOUNT_ID=$AWS_ACCOUNT_ID" >> $GITHUB_ENV

          echo "ECR_REGISTRY=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com" \
            >> $GITHUB_ENV


      - name: Display ECR information
        run: |
          echo "AWS Region: $AWS_REGION"
          echo "ECR Registry: $ECR_REGISTRY"
          echo "ECR Repository: $ECR_REPOSITORY"


      # Creates repository if it does not already exist
      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories \
            --repository-names $ECR_REPOSITORY \
            --region $AWS_REGION \
          || \
          aws ecr create-repository \
            --repository-name $ECR_REPOSITORY \
            --region $AWS_REGION


      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password \
            --region $AWS_REGION \
          | docker login \
            --username AWS \
            --password-stdin \
            $ECR_REGISTRY


      # Example:
      # 123456789012.dkr.ecr.ap-south-1.amazonaws.com/aws-docker-html:1.0.7
      - name: Tag image with application version
        run: |
          docker tag \
            $APP_NAME:$APP_VERSION \
            $ECR_REGISTRY/$ECR_REPOSITORY:$APP_VERSION


      - name: Push versioned image to ECR
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$APP_VERSION


      # Also keep exact Git commit traceability
      - name: Tag image with Git commit SHA
        run: |
          docker tag \
            $APP_NAME:$APP_VERSION \
            $ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA


      - name: Push Git SHA tag to ECR
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA


      # Optional convenience tag
      - name: Tag image as latest
        run: |
          docker tag \
            $APP_NAME:$APP_VERSION \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest


      - name: Push latest tag to ECR
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest


      - name: Cleanup downloaded artifact
        if: always()
        run: |
          rm -f $APP_NAME-$APP_VERSION.tar



  # ==========================================================
  # JOB 3
  # PULL EXACT VERSION FROM ECR
  # DEPLOY IT ON EC2
  # ==========================================================

  deploy:
    name: Deploy ECR Image to EC2

    needs: publish-ecr

    runs-on: [self-hosted, Linux, X64]

    steps:

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      - name: Set ECR registry
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          echo "ECR_REGISTRY=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com" \
            >> $GITHUB_ENV


      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password \
            --region $AWS_REGION \
          | docker login \
            --username AWS \
            --password-stdin \
            $ECR_REGISTRY


      - name: Pull exact application version from ECR
        run: |
          docker pull \
            $ECR_REGISTRY/$ECR_REPOSITORY:$APP_VERSION


      - name: Verify pulled image
        run: |
          docker images


      - name: Remove existing application container
        run: |
          docker rm -f $APP_NAME || true


      - name: Deploy exact ECR version
        run: |
          docker run -d \
            --name $APP_NAME \
            --restart unless-stopped \
            -p 80:80 \
            $ECR_REGISTRY/$ECR_REPOSITORY:$APP_VERSION


      - name: Wait for application
        run: |
          sleep 3


      - name: Verify running container
        run: |
          docker ps --format \
            "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"


      - name: Verify website
        run: |
          curl --fail http://localhost


      - name: Display deployed version
        run: |
          echo "======================================"
          echo "DEPLOYMENT SUCCESSFUL"
          echo ""
          echo "Application: $APP_NAME"
          echo "Version: $APP_VERSION"
          echo "AWS Region: $AWS_REGION"
          echo ""
          echo "Deployed image:"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:$APP_VERSION"
          echo ""
          echo "Git commit:"
          echo "$GITHUB_SHA"
          echo "======================================"
